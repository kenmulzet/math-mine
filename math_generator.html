<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Math Mine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4">⛏️ Math Mine 💎</h1>

    <form id="problem-form" class="mb-4">

      <!-- Topic Dropdown -->
      <div class="mb-3">
        <label for="type" class="form-label">Select Problem Type</label>
        <select name="type" id="topic" class="form-select">
          <option value="" selected disabled>-- Choose --</option>
          <option value="algebra">Algebra</option>
          <option value="geometry">Geometry</option>
          <option value="calculus">Calculus I</option>
          <option value="diffeq">Differential Equations</option>
        </select>
      </div>

      <!-- Container for dynamic subtopics -->
      <div id="problemTypes" class="mt-3"></div>

      <div class="mb-3">
        <label class="form-label">Include Answers</label><br>
        <input type="radio" name="include_answers" value="text" checked> Yes
        <input type="radio" name="include_answers" value="latex"> No
      </div> 

      <button type="submit" class="btn btn-primary">Excavate</button>

      <button id="reset-btn" class="btn btn-primary">Reset</button>
    </form>

    <div id="outputDiv" class="border p-3 bg-white"></div>
  </div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("problem-form");
    const topicSelector = document.getElementById("topic");
    const problemTypesContainer = document.getElementById("problemTypes");

async function loadProblemTypes(mapNames) {
  const problemTypes = {};

  for (const mapName of mapNames) {
    try {
      const response = await fetch(`/maps/${mapName}`);
      if (!response.ok) throw new Error(`Failed to load ${mapName} map`);

      const data = await response.json();

      // Transform backend-style JSON into frontend array format
      problemTypes[mapName] = Object.entries(data).map(([key, value]) => ({
        label: value.label,
        key: key
      }));
    } catch (error) {
      console.error(`Error loading ${mapName} map:`, error);
      problemTypes[mapName] = []; // fallback to empty array
    }
  }

  return problemTypes;
}

    const mapNames = ["algebra", "geometry", "calculus", "diffeq"];
    let problemTypes = {}; // Declare in outer scope

    loadProblemTypes(mapNames).then(loadedTypes => {
      problemTypes = loadedTypes; // update the outer scoped variable
      console.log("Loaded problemTypes:", problemTypes);
    });

    console.log(problemTypes)

    // 🧠 Dynamically load problem type inputs
    topicSelector.addEventListener("change", function () {
      const selectedTopic = this.value;
      problemTypesContainer.innerHTML = "";

      if (problemTypes[selectedTopic]) {
        problemTypes[selectedTopic].forEach(type => {
          const id = type.key;  // Use the backend-friendly key
          const label = type.label;  // Use the human-readable label

          problemTypesContainer.innerHTML += `
            <div class="mb-2">
              <label for="${id}_count" class="form-label">${label}</label>
              <input type="number" name="${id}_count" id="${id}_count" min="0" value="0" class="form-control w-25 d-inline-block ms-2">
            </div>
          `;
        });
      }
    });

    // 🚀 Handle form submission and inject HTML
      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const problemData = {};
        numProblems = 0;
        const inputs = document.querySelectorAll("input[type='number']");
        if (inputs.length === 0) {
          alert("Please select a problem type before excavating.");
          return; // stop execution
        }

        inputs.forEach(input => {
          const count = parseInt(input.value);
          if (count > 0) {
            const key = input.name.replace("_count", "");
            problemData[key] = count;
            numProblems += count;
          }  
        });

        if (numProblems === 0) {
          alert("⚠️ Please select at least one problem before excavating.");
          return;
        }

        // Optional: include answers toggle
        const includeAnswers = document.querySelector("#includeAnswersCheckbox")?.checked;
        problemData.include_answers = includeAnswers;

        const response = await fetch("http://localhost:8000/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(problemData)
        });

        if (!response.ok) {
          const errorText = await response.text(); // This will show the HTML error
          console.error("Backend error:", errorText);
          throw new Error("Worksheet generation failed");
        }

        const data = await response.json();
        const worksheetHTML = data.html;
        const HTML_filename = data.HTML_filename;
        const PDF_filename = data.PDF_filename;
        const outputDiv = document.getElementById("outputDiv");
        outputDiv.innerHTML = ""; // clear previous content

        const link1 = document.createElement("a");
        link1.href = `http://localhost:8000/static/${HTML_filename}`;
        link1.textContent = "📄 View Webpage";
        link1.target = "_blank";
        link1.style.display = "block";
        link1.style.marginTop = "1em";

        const link2 = document.createElement("a");
        link2.href = `http://localhost:8000/${PDF_filename}`;
        link2.textContent = "📄 View PDF";
        link2.target = "_blank";
        link2.rel = "noopener noreferrer";

        outputDiv.appendChild(link1);
        outputDiv.appendChild(link2);
      });
  });

document.getElementById("topic").addEventListener("change", () => {
  const outputDiv = document.getElementById("outputDiv");
  const links = outputDiv.querySelectorAll("a");

  links.forEach(link => outputDiv.removeChild(link));
});

document.getElementById("reset-btn").addEventListener("click", () => {
  location.reload();
});

</script>
</body>
</html>
